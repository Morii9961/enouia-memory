[package]
name = "enouia-memory-host"
version = "0.1.0"
default-run = "enouia-memory-host"
edition.workspace = true
rust-version.workspace = true

[dependencies]
enouia-memory-contract = { path = "../enouia-memory-contract" }
enouia-memory-vault = { path = "../enouia-memory-vault" }
enouia-memory-workspace = { path = "../enouia-memory-workspace" }
enouia-memory-index = { path = "../enouia-memory-index" }
enouia-memory-context = { path = "../enouia-memory-context" }
enouia-memory-govern = { path = "../enouia-memory-govern" }
enouia-memory-import = { path = "../enouia-memory-import" }
serde_json.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
