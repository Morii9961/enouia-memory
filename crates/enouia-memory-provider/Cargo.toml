[package]
name = "enouia-memory-provider"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
enouia-memory-contract = { path = "../enouia-memory-contract" }
enouia-memory-context = { path = "../enouia-memory-context" }
enouia-memory-vault = { path = "../enouia-memory-vault" }
enouia-memory-govern = { path = "../enouia-memory-govern" }
enouia-memory-index = { path = "../enouia-memory-index" }
enouia-memory-import = { path = "../enouia-memory-import" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
