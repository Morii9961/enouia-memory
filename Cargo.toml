[workspace]
members = [
    "crates/enouia-memory-cli",
    "crates/enouia-memory-contract",
    "crates/enouia-memory-context",
    "crates/enouia-memory-govern",
    "crates/enouia-memory-import",
    "crates/enouia-memory-index",
    "crates/enouia-memory-vault",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
