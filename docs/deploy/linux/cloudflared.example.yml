# Template: /etc/cloudflared/config.yml when the VPS uses a named Cloudflare
# Tunnel instead of Caddy (no inbound port; the domain's zone is on Cloudflare).
# Placeholders: the tunnel name/ID and memory.example.org.
#   cloudflared tunnel create enouia-memory
#   cloudflared tunnel route dns enouia-memory memory.example.org
#   cloudflared service install
tunnel: enouia-memory
credentials-file: /etc/cloudflared/00000000-0000-4000-8000-000000000000.json
ingress:
  - hostname: memory.example.org
    service: http://127.0.0.1:8787
  - service: http_status:404
